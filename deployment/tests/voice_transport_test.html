<!doctype html>
<meta charset="utf-8">
<title>Bisca LiveKit smoke test</title>
<style>body{background:#48465f;color:#fde4b9;font:18px system-ui;padding:30px}button{padding:16px}</style>
<h1>LiveKit browser smoke test</h1>
<p>Non accede al microfono e non si connette al cloud.</p>
<button id="run">VERIFICA SDK</button><pre id="result"></pre>
<script src="../../scenes/balatro/scripts/livekit-client.umd.js"></script>
<script src="../../scenes/balatro/scripts/voice_transport.js"></script>
<script>
document.querySelector('#run').onclick=async()=>{
  const output=document.querySelector('#result');
  try {
    const sdk=window.LivekitClient;
    if(!sdk?.Room||!sdk.isBrowserSupported())throw Error('SDK/browser non supportato');
    const context=new AudioContext();await context.resume();
    const room=new sdk.Room({webAudioMix:{audioContext:context}});
    if(room.state!=='disconnected')throw Error('Stato iniziale errato');
    const voice=window.BiscaVoice;
    voice.update('test','a',[{id:'b',name:'Amico',connected:true,slot:1}]);
    voice.setVolume('b',0.3);voice.setMaster(0.5);
    voice.openPanel();
    if(!document.querySelector('[aria-label="Chat vocale"]'))throw Error('Pannello assente');
    voice.closePanel();voice.stop();
    await room.disconnect();await context.close();
    output.textContent='PASS: SDK ufficiale, browser compatibile, Web Audio, pannello, cleanup. Nessun microfono utilizzato.';
  }catch(error){output.textContent='FAIL: '+error.message;}
};
</script>
